name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # Version detection needs the complete tag history.
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build public version
        run: ./gradlew buildPublic

      - name: locate built jars
        id: jars
        run: |
          OUTPUT_DIR=$(find build/libs -mindepth 2 -maxdepth 2 -type d \( -name 'release' -o -name 'beta.*' \) -print -quit)
          if [ -z "$OUTPUT_DIR" ]; then echo "Build output directory not found"; exit 1; fi

          MAIN=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          SOURCES=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*-sources.jar' -print -quit)
          if [ -z "$MAIN" ]; then echo "Main jar not found in $OUTPUT_DIR"; exit 1; fi

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "output dir:  $OUTPUT_DIR"
          echo "main jar:    $MAIN"
          echo "sources jar: $SOURCES"

      - name: upload jar (Artifact)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.main }}
          archive: false

      - name: upload sources jar (Artifact)
        uses: actions/upload-artifact@v7
        if: steps.jars.outputs.sources != ''
        with:
          path: ${{ steps.jars.outputs.sources }}
          archive: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Heigui Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ steps.jars.outputs.main }}
            ${{ steps.jars.outputs.sources }}
