name: build

# 記得要加上 tags 條件，這樣你推標籤時才會觸發編譯！
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

# Beta numbers are allocated globally, so builds must not race while reading
# and writing their counter tags.
concurrency:
  group: heigui-build-sequence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # 必須抓完整歷史與所有 tag，否則 build.gradle.kts 裡的 git describe /
          # rev-list --not --tags 會失靈，連推 tag 的 build 都會被誤判成 beta
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: determine beta number
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          LATEST_RELEASE_TAG=$(git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$LATEST_RELEASE_TAG" ]; then
            BASELINE=$(git rev-list -n 1 "$LATEST_RELEASE_TAG")
          else
            BASELINE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          PREFIX="beta-build/$BASELINE/"
          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" --list "$PREFIX*" | head -n 1)
          if [ -n "$EXISTING_TAG" ]; then
            BETA_NUMBER=${EXISTING_TAG#"$PREFIX"}
            BETA_TAG=$EXISTING_TAG
          else
            LAST_BETA=$(git tag --list "$PREFIX*" | sed "s#^$PREFIX##" | sort -n | tail -n 1)
            BETA_NUMBER=$((${LAST_BETA:-0} + 1))
            BETA_TAG="$PREFIX$BETA_NUMBER"
          fi

          echo "HEIGUI_BETA_NUMBER=$BETA_NUMBER" >> "$GITHUB_ENV"
          echo "HEIGUI_BETA_TAG=$BETA_TAG" >> "$GITHUB_ENV"
          echo "beta number: $BETA_NUMBER"

      - name: build public version
        run: ./gradlew buildPublic

      # ==========================================
      # 1. 產生 Actions 後台的 Artifact (裸 .jar，不壓縮)
      # ==========================================
      # archive: false 只接受「單一具體檔案」，不能給 glob，
      # 所以先在這裡把路徑算出來
      - name: locate built jars
        id: jars
        run: |
          MAIN=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -1)
          SOURCES=$(find build/libs -name '*-sources.jar' | head -1)
          if [ -z "$MAIN" ]; then echo "找不到主 jar"; exit 1; fi
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "main jar:    $MAIN"
          echo "sources jar: $SOURCES"

      # archive: false 會忽略 name，artifact 名稱直接用檔名
      # (例如 Heigui-Public-1.3.9-beta.3-26.1.2.jar)
      - name: upload jar (Artifact)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          path: ${{ steps.jars.outputs.main }}
          archive: false

      - name: upload sources jar (Artifact)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && steps.jars.outputs.sources != ''
        with:
          path: ${{ steps.jars.outputs.sources }}
          archive: false

      - name: record beta build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          if git rev-parse "$HEIGUI_BETA_TAG" >/dev/null 2>&1; then
            echo "Beta tag $HEIGUI_BETA_TAG already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$HEIGUI_BETA_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$HEIGUI_BETA_TAG"

      # ==========================================
      # 2. 建立正式 Release (獨立的 .jar 檔案)
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # 只有你 Push Tag 時才會執行這步
        with:
          name: "Heigui Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            build/libs/**/*.jar     
            build/libs/**/*-sources.jar
