name: build

# 記得要加上 tags 條件，這樣你推標籤時才會觸發編譯！
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # 必須抓完整歷史與所有 tag，否則 build.gradle.kts 裡的 git describe /
          # rev-list --not --tags 會失靈，連推 tag 的 build 都會被誤判成 beta
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      # ==========================================
      # 1. 產生 Actions 後台的 Artifact (.zip)
      # ==========================================
      - name: upload release jar (Artifact)
        uses: actions/upload-artifact@v4
        with:
          # 帶上 commit 讓 Actions 後台也能分辨不同 build
          name: Heigui-Build-${{ github.sha }}
          path: |
            build/libs/**/*.jar      
            build/libs/**/*-sources.jar

      # ==========================================
      # 2. 建立正式 Release (獨立的 .jar 檔案)
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') # 只有你 Push Tag 時才會執行這步
        with:
          name: "Heigui Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            build/libs/**/*.jar     
            build/libs/**/*-sources.jar