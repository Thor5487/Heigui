name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

# Beta numbers are allocated globally, so builds must not race while reading
# and writing their counter tags.
concurrency:
  group: heigui-build-sequence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # Version detection needs the complete tag history.
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: determine beta number
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          LATEST_RELEASE_TAG=$(git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$LATEST_RELEASE_TAG" ]; then
            BASELINE=$(git rev-list -n 1 "$LATEST_RELEASE_TAG")
          else
            BASELINE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          PREFIX="beta-build/$BASELINE/"
          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" --list "$PREFIX*" | head -n 1)
          if [ -n "$EXISTING_TAG" ]; then
            BETA_NUMBER=${EXISTING_TAG#"$PREFIX"}
            BETA_TAG=$EXISTING_TAG
          else
            LAST_BETA=$(git tag --list "$PREFIX*" | sed "s#^$PREFIX##" | sort -n | tail -n 1)
            BETA_NUMBER=$((${LAST_BETA:-0} + 1))
            BETA_TAG="$PREFIX$BETA_NUMBER"
          fi

          echo "HEIGUI_BETA_NUMBER=$BETA_NUMBER" >> "$GITHUB_ENV"
          echo "HEIGUI_BETA_TAG=$BETA_TAG" >> "$GITHUB_ENV"
          echo "beta number: $BETA_NUMBER"

      - name: build public version
        run: ./gradlew buildPublic

      - name: locate built jars
        id: jars
        run: |
          OUTPUT_DIR=$(find build/libs -mindepth 2 -maxdepth 2 -type d \( -name 'release' -o -name 'beta.*' \) -print -quit)
          if [ -z "$OUTPUT_DIR" ]; then echo "Build output directory not found"; exit 1; fi

          MAIN=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)
          SOURCES=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*-sources.jar' -print -quit)
          if [ -z "$MAIN" ]; then echo "Main jar not found in $OUTPUT_DIR"; exit 1; fi

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "output dir:  $OUTPUT_DIR"
          echo "main jar:    $MAIN"
          echo "sources jar: $SOURCES"

      - name: upload jar (Artifact)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          path: ${{ steps.jars.outputs.main }}
          archive: false

      - name: upload sources jar (Artifact)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && steps.jars.outputs.sources != ''
        with:
          path: ${{ steps.jars.outputs.sources }}
          archive: false

      - name: record beta build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          if git rev-parse "$HEIGUI_BETA_TAG" >/dev/null 2>&1; then
            echo "Beta tag $HEIGUI_BETA_TAG already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$HEIGUI_BETA_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$HEIGUI_BETA_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Heigui Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ${{ steps.jars.outputs.main }}
            ${{ steps.jars.outputs.sources }}
